# Auto-fix the mechanical rules (blank-line spacing, list indentation, emphasis
# style, ...) the same way ruff-format does for Python.
fix: true
config:
  # MD013 line-length: docs contain long lines / tables.
  MD013: false
  # MD033 no-inline-html: docs embed <p>/<code> HTML tags.
  MD033: false
  # MD024 duplicate-heading: changelogs repeat "### Improvements" / "### Breaking
  # Changes" under each release section; allow when not direct siblings.
  MD024:
    siblings_only: true
  # MD040 fenced-code-language: README embeds plain directory-tree / output blocks.
  MD040: false
  # MD041 first-line-heading: README opens with the HTML branding/logo header.
  MD041: false
  # MD045 image-alt-text: the branding header uses <img> logos / social icons.
  MD045: false
  # MD053 link-reference-definitions: the READMEs use `[comment]: <> (...)` marker
  # lines (a comment idiom) that the release Makefile slices on — never strip them.
  MD053: false
# NO `globs:` KEY ON PURPOSE. markdownlint-cli2 ADDS the config globs to the file
# arguments it is given, so `globs: ["*.md"]` made every parallel pre-commit chunk
# lint (and, with `fix: true`, REWRITE) every root *.md on top of its own chunk.
# Two concurrent --fix passes over the same RELEASE.md tore it apart: a dropped
# changelog bullet, "## Release" demoted to "# Release", and "ONDEWO" truncated to
# "ONDEW". pre-commit passes the files to lint; that list is authoritative here.
# To lint by hand, name the files: `npx markdownlint-cli2 "*.md" "src/*.md"`.
ignores:
  - 'node_modules/**'
  - 'api/**'
  - 'src/ondewo-t2s-api/**'
  - 'ondewo-proto-compiler/**'
  - '.venv/**'
